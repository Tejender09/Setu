<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="pearlTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8f9ff"/>
      <stop offset="100%" stop-color="#f0effe"/>
    </linearGradient>

    <linearGradient id="bridgeTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="bridgeBottom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <filter id="cleanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#4f46e5" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#6366f1" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- App Tile Background -->
  <rect width="512" height="512" rx="124" fill="url(#pearlTile)"/>
  <rect width="506" height="506" x="3" y="3" rx="121" stroke="#ffffff" stroke-width="3" stroke-opacity="0.95"/>
  <circle cx="256" cy="225" r="140" fill="#ede9fe" fill-opacity="0.25"/>

  <!-- Logo Mark: Modernist Architectural 'Setu' (Pure Geometric Arch & Beam) -->
  <g filter="url(#cleanGlow)">
    <!-- Upper Arch Bridge (Spans left to right) -->
    <path d="M 170 235 C 170 160 210 145 256 145 C 302 145 342 160 342 235" 
          fill="none" 
          stroke="url(#bridgeTop)" 
          stroke-width="18" 
          stroke-linecap="round"/>

    <!-- Inverted Foundation Arch forming the lower bridge reflection & abstract S-flow -->
    <path d="M 170 235 C 170 310 210 325 256 325 C 302 325 342 310 342 235" 
          fill="none" 
          stroke="url(#bridgeBottom)" 
          stroke-width="18" 
          stroke-linecap="round"/>

    <!-- Central Horizon Data Beam (Connection Bridge / NFC Proximity line) -->
    <line x1="140" y1="235" x2="372" y2="235" 
          stroke="#6366f1" 
          stroke-width="8" 
          stroke-linecap="round" 
          opacity="0.25"/>
    <line x1="205" y1="235" x2="307" y2="235" 
          stroke="#6366f1" 
          stroke-width="8" 
          stroke-linecap="round"/>

    <!-- Central Instant Tap Node -->
    <circle cx="256" cy="235" r="16" fill="#ffffff"/>
    <circle cx="256" cy="235" r="9" fill="#6366f1"/>
    <circle cx="256" cy="235" r="3.5" fill="#ffffff"/>

    <!-- Proximity Pulse Echo Rings -->
    <circle cx="256" cy="235" r="44" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="4 6" opacity="0.6"/>
  </g>

  <!-- Clean Wordmark -->
  <text x="256" y="445" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="26" 
        font-weight="800" 
        letter-spacing="10" 
        fill="#1e1b4b">SETU</text>
</svg>
