[versions]
androidGradlePlugin = "9.0.1"
kotlin = "2.3.20"
androidxCore = "1.18.0"
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.1.4"
nearbyConnections = "18.5.0"
androidxActivity = "1.13.0"
androidxFragment = "1.8.0"
androidxLifecycle = "2.10.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
nearby-connections = { module = "com.google.android.gms:play-services-nearby", version.ref = "nearbyConnections" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "androidxActivity" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "androidxFragment" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
